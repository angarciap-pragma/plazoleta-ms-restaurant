spring.application.name=ms-restaurant

spring.datasource.url=${RESTAURANT_DATASOURCE_URL:jdbc:mysql://localhost:3306/ms_restaurant}
spring.datasource.username=${RESTAURANT_DATASOURCE_USERNAME:root}
spring.datasource.password=${RESTAURANT_DATASOURCE_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

server.port=${SERVER_PORT:8083}

management.endpoints.web.exposure.include=health,info
springdoc.swagger-ui.path=/swagger-ui.html

security.jwt.secret=${AUTH_JWT_SECRET:plazoleta-auth-shared-secret-please-change-123456789}
security.jwt.issuer=${AUTH_JWT_ISSUER:plazoleta-auth}

restaurant.clients.user-service.base-url=${USER_SERVICE_BASE_URL:http://localhost:8082}
