spring.datasource.url=jdbc:h2:mem:msrestaurant;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.show-sql=false
security.jwt.secret=this-is-a-shared-secret-key-with-safe-length-123456
security.jwt.issuer=plazoleta-auth
